name: Backend tests

on:
  pull_request:
    paths: ['backend/**', '.github/workflows/backend-tests.yml']
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend-tests.yml']

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    env:
      CENTAUR_DATABASE_URL: postgresql+asyncpg://fixture:fixture@127.0.0.1:1/unused
      PYTHONPATH: .
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements.txt pytest pip-audit
      - run: python -m pytest --import-mode=importlib -q backend/tests
      - run: python -m pip_audit
